name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Base overview (followers, contributions, etc.)
      - uses: lowlighter/metrics@latest
        name: Base metrics
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: darko5r
          filename: .github/templates/metrics_base.svg
          base: header, repositories
          plugin_lines: yes

      # Languages (bytes + percentage)
      - uses: lowlighter/metrics@latest
        name: Languages (bytes + percentage)
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: darko5r
          filename: .github/templates/metrics_lang.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 400

      # Languages (percentage only)
      - uses: lowlighter/metrics@latest
        name: Languages (percentage only)
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: darko5r
          filename: .github/templates/metrics_lang_per.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 400

      # Habits (coding patterns)
      - uses: lowlighter/metrics@latest
        name: Habits charts
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: darko5r
          filename: .github/templates/metrics_habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200   # use last 200 events
          plugin_habits_days: 14    # look at last 14 days
          config_timezone: America/Argentina/Buenos_Aires
